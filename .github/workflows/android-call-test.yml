name: Android call test

# The real app on Android test phones (emulators), driven over adb: it makes
# calls and takes them, and records anything that crashes
# (two-android/calltest/drive.mjs). Runs on the call-tests branch and on
# demand - never on main - and publishes nothing to phones. The results go to
# the call-test-results branch, where they can be read without signing in.

on:
  push:
    branches: [ call-tests ]
  workflow_dispatch:

concurrency:
  group: android-call-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the test app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: two-web/package-lock.json

      - name: Build the web app
        working-directory: two-web
        run: |
          npm ci
          npm test
          npm run build

      - name: Bundle it into Android
        run: |
          rm -rf two-android/app/src/main/assets/www
          mkdir -p two-android/app/src/main/assets/www
          cp -r two-web/dist/. two-android/app/src/main/assets/www/

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      # The release build, shrunk exactly as release is, but debuggable and
      # signed with the debug key (the calltest build type).
      - name: Build the calltest APK
        working-directory: two-android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          set +e
          ./gradlew assembleCalltest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            reason=$(grep -A12 -E "What went wrong|e: |Error: |ERROR: " "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::${reason:-see the step log}"
            exit "$status"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: calltest-apk
          path: two-android/app/build/outputs/apk/calltest/*.apk
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: two-web/dist
          retention-days: 7

  phones:
    name: Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [ 33, 34, 35, 36 ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: two-server/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: calltest-apk
          path: apk

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      # The relay both phones talk through, keeping everything in memory.
      - name: Start the relay
        working-directory: two-server
        run: |
          npm ci
          nohup env PORT=4100 npx tsx src/server.ts > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/health && break; sleep 1; done

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make and take calls on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
          OUT: ${{ github.workspace }}/calltest-results/api-${{ matrix.api }}
          APK_DIR: ${{ github.workspace }}/apk
          WEB_DIST: ${{ github.workspace }}/web-dist
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          # Sound left on (no -no-audio): a call needs a microphone to open.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: node two-android/calltest/drive.mjs

      - name: Say what happened
        if: always()
        run: |
          S="calltest-results/api-${{ matrix.api }}/summary.json"
          if [ ! -f "$S" ]; then echo "::error title=Android ${{ matrix.api }}::No results"; exit 1; fi
          cat "$S"
          cp "$RUNNER_TEMP/relay.log" "calltest-results/api-${{ matrix.api }}/relay.log" || true
          node -e '
            const s = require("./'"$S"'");
            const line = s.scenarios.map(x => (x.ok ? "ok " : "FAIL ") + x.title + (x.crashed ? " (APP CLOSED)" : "") + (x.failedChecks && x.failedChecks.length ? " [" + x.failedChecks.join("; ") + "]" : "") + (x.error ? " {" + x.error.slice(0, 160) + "}" : "")).join("%0A");
            const kind = s.failed ? "error" : "notice";
            console.log(`::${kind} title=Android ${s.device.android || "?"} (API ${s.api}): ${s.passed} passed, ${s.failed} failed::${line}`);
            process.exit(s.failed ? 1 : 0);
          '

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-api-${{ matrix.api }}
          path: calltest-results
          retention-days: 7

  publish:
    name: Publish the results
    needs: phones
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: results-api-*
          path: incoming
          merge-multiple: true

      - name: Push them to the call-test-results branch
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "$RUNNER_TEMP/out"
          cp -r incoming/. "$RUNNER_TEMP/out/"
          git config user.name "Two test phones"
          git config user.email "calltest@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin call-test-results >/dev/null 2>&1; then
            git fetch --depth=1 origin call-test-results
            git checkout -B call-test-results FETCH_HEAD
          else
            git checkout --orphan call-test-results
            git rm -rf --quiet . || true
          fi
          rm -rf "runs/$RUN"
          mkdir -p "runs/$RUN"
          cp -r "$RUNNER_TEMP/out/." "runs/$RUN/"
          echo "$RUN" > latest.txt
          git add runs latest.txt
          git commit --quiet -m "Call test results $RUN"
          git push --quiet origin call-test-results
          echo "::notice title=Results::runs/$RUN on the call-test-results branch"
