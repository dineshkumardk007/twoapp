name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export APK
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu on
    # GitHub's schedule - a build should only change when this file does.
    runs-on: ubuntu-24.04
    env:
      # A release build once the signing key is in the repository's secrets,
      # and the debug build until then - so a missing key never breaks a build.
      HAS_RELEASE_KEY: ${{ secrets.TWO_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: two-web/package-lock.json

      - name: Build Web Application Bundle
        run: |
          npm ci
          npm run build
        working-directory: two-web

      # Replaced, not merged: copying over the committed copy left every older
      # hashed bundle inside the APK alongside the current one.
      - name: Bundle Web Assets into Android
        run: |
          rm -rf two-android/app/src/main/assets/www
          mkdir -p two-android/app/src/main/assets/www
          cp -r two-web/dist/. two-android/app/src/main/assets/www/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: two-android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: two-android

      - name: Build Debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: two-android

      - name: Upload Debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: two-android-debug-apk
          path: two-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Signed with the one key only its owner holds: not debuggable, so the
      # app's data cannot be copied off a phone over USB, and every build
      # installs over the last one instead of being refused as a stranger.
      - name: Build Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          TWO_KEYSTORE_BASE64: ${{ secrets.TWO_KEYSTORE_BASE64 }}
          TWO_KEYSTORE_PASSWORD: ${{ secrets.TWO_KEYSTORE_PASSWORD }}
          TWO_KEY_ALIAS: ${{ secrets.TWO_KEY_ALIAS }}
          TWO_KEY_PASSWORD: ${{ secrets.TWO_KEY_PASSWORD }}
        run: |
          export TWO_KEYSTORE_FILE="$RUNNER_TEMP/two-release.p12"
          printf '%s' "$TWO_KEYSTORE_BASE64" | base64 --decode > "$TWO_KEYSTORE_FILE"
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$TWO_KEYSTORE_FILE"
          if [ "$status" -ne 0 ]; then
            # The log is only visible when signed in; the reason also goes into
            # an annotation, which the run's public summary shows.
            reason=$(grep -A12 -E "What went wrong|Error: |ERROR: " "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build failed::${reason:-see the step log}"
            exit "$status"
          fi

          # Refuse to hand over anything unsigned or signed with another key.
          APK=$(ls app/build/outputs/apk/release/*.apk)
          case "$APK" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -q "CN=Two" "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=Wrong signing key::The release APK is not signed with the Two key"
            exit 1
          fi
          echo "::notice title=Signed release APK::$(basename "$APK") is signed with the Two key"
        working-directory: two-android

      # Uploaded as the .apk itself rather than inside a zip, so it installs
      # straight from a phone's downloads.
      - name: Upload Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: two-android/app/build/outputs/apk/release/app-release.apk
          archive: false
          retention-days: 30
