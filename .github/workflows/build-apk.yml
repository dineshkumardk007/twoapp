name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: two-web/package-lock.json

      - name: Build Web Application Bundle
        run: |
          npm ci
          npm run build
        working-directory: two-web

      - name: Bundle Web Assets into Android
        run: |
          mkdir -p two-android/app/src/main/assets/www
          cp -r two-web/dist/* two-android/app/src/main/assets/www/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: two-android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: two-android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: two-android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: two-android-debug-apk
          path: two-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
