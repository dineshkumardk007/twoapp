name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export APK
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu on
    # GitHub's schedule - a build should only change when this file does.
    runs-on: ubuntu-24.04
    # Writing is for publishing the release the app updates from (below).
    permissions:
      contents: write
    env:
      # A release build once the signing key is in the repository's secrets,
      # and the debug build until then - so a missing key never breaks a build.
      HAS_RELEASE_KEY: ${{ secrets.TWO_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The whole history and its tags, to say what changed since the
          # last release.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: two-web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci
        working-directory: two-web

      # The app's own checks - syncing, answers, the lock, updates. A failure
      # stops here, so a build that breaks one never reaches the phones.
      - name: Run Checks
        run: npm test
        working-directory: two-web

      - name: Build Web Application Bundle
        run: npm run build
        working-directory: two-web

      # Replaced, not merged: copying over the committed copy left every older
      # hashed bundle inside the APK alongside the current one.
      - name: Bundle Web Assets into Android
        run: |
          rm -rf two-android/app/src/main/assets/www
          mkdir -p two-android/app/src/main/assets/www
          cp -r two-web/dist/. two-android/app/src/main/assets/www/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          # The open-source cache (GitHub's own actions/cache). The default
          # "enhanced" one is a closed-source add-on under separate terms, and
          # one more service to reach: a build once failed on a dropped
          # connection while it restored.
          cache-provider: basic

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: two-android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: two-android

      - name: Build Debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: two-android

      - name: Upload Debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: two-android-debug-apk
          path: two-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Signed with the one key only its owner holds: not debuggable, so the
      # app's data cannot be copied off a phone over USB, and every build
      # installs over the last one instead of being refused as a stranger.
      - name: Build Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          TWO_KEYSTORE_BASE64: ${{ secrets.TWO_KEYSTORE_BASE64 }}
          TWO_KEYSTORE_PASSWORD: ${{ secrets.TWO_KEYSTORE_PASSWORD }}
          TWO_KEY_ALIAS: ${{ secrets.TWO_KEY_ALIAS }}
          TWO_KEY_PASSWORD: ${{ secrets.TWO_KEY_PASSWORD }}
        run: |
          export TWO_KEYSTORE_FILE="$RUNNER_TEMP/two-release.p12"
          printf '%s' "$TWO_KEYSTORE_BASE64" | base64 --decode > "$TWO_KEYSTORE_FILE"
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$TWO_KEYSTORE_FILE"
          if [ "$status" -ne 0 ]; then
            # The log is only visible when signed in; the reason also goes into
            # an annotation, which the run's public summary shows.
            reason=$(grep -A12 -E "What went wrong|Error: |ERROR: " "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build failed::${reason:-see the step log}"
            exit "$status"
          fi

          # Refuse to hand over anything unsigned or signed with another key.
          APK=$(ls app/build/outputs/apk/release/*.apk)
          case "$APK" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -q "CN=Two" "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=Wrong signing key::The release APK is not signed with the Two key"
            exit 1
          fi
          echo "::notice title=Signed release APK::$(basename "$APK") is signed with the Two key"
        working-directory: two-android

      # Uploaded as the .apk itself rather than inside a zip, so it installs
      # straight from a phone's downloads.
      - name: Upload Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: two-android/app/build/outputs/apk/release/app-release.apk
          archive: false
          retention-days: 30

      # The release the app updates itself from (AppUpdater on Android): the
      # APK and update.json, which names the version, the APK's SHA-256 and
      # what is new. A release download needs no GitHub login, unlike the
      # artifact above. Only main publishes, so a branch never reaches phones.
      - name: Publish Update
        if: env.HAS_RELEASE_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE="$GITHUB_RUN_NUMBER"
          NAME="1.0.$GITHUB_RUN_NUMBER"
          TAG="v$NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Already published::$TAG"
            exit 0
          fi
          APK="$RUNNER_TEMP/two-$NAME.apk"
          cp two-android/app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")

          # What is new: the commits since the last release, by their titles.
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            # --max-count rather than | head: under pipefail, head closing the
            # pipe early fails the whole step.
            git log --no-merges --max-count=8 --format='%s' "$PREV..HEAD" > "$RUNNER_TEMP/notes.txt"
          else
            git log -1 --format='%s' > "$RUNNER_TEMP/notes.txt"
          fi
          [ -s "$RUNNER_TEMP/notes.txt" ] || echo "Small fixes" > "$RUNNER_TEMP/notes.txt"

          jq -n \
            --argjson code "$CODE" \
            --arg name "$NAME" \
            --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/two-$NAME.apk" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            --rawfile notes "$RUNNER_TEMP/notes.txt" \
            '{versionCode: $code, versionName: $name, apk: $apk, sha256: $sha, size: $size,
              notes: ($notes | split("\n") | map(select(length > 0)))}' > "$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"

          sed 's/^/- /' "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/body.md"
          gh release create "$TAG" "$APK" "$RUNNER_TEMP/update.json" \
            --title "Two $NAME" \
            --notes-file "$RUNNER_TEMP/body.md" \
            --target "$GITHUB_SHA" \
            --latest
          echo "::notice title=Update published::$TAG - phones on an older version will be asked to update"
