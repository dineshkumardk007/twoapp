<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="192" height="192" role="img" aria-label="Two">
  <title>Two</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1D5C"/>
      <stop offset="0.55" stop-color="#160F33"/>
      <stop offset="1" stop-color="#0E0B1F"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.18" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="1" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="1.08" r="0.62">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pinkpeach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE4F1"/>
    </linearGradient>
  </defs>
  <!-- Two circles, one for each of you, and the bright space you share. -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#sky)"/>
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#glowV)"/>
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#glowP)"/>
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#glowO)"/>
  <g transform="translate(54 54) scale(1.2) translate(-54 -54)">
  <circle cx="44" cy="54" r="18" fill="url(#violet)"/>
  <circle cx="64" cy="54" r="18" fill="url(#pinkpeach)"/>
  <path d="M54,39.03 A18,18 0 0 1 54,68.97 A18,18 0 0 1 54,39.03 Z" fill="url(#lens)"/>
  </g>
</svg>
