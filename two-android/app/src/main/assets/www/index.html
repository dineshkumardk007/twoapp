  <body class="bg-linen-bg text-linen-primary font-sans antialiased selection:bg-linen-accent/20">
    <div id="root"></div>
    <script>
      // In local development, unregister any stale service workers and clear cache storage to prevent stale Vite modules
      const isDevEnv = 
        window.location.hostname === 'localhost' || 
        window.location.hostname === '127.0.0.1' || 
        window.location.port === '3000' ||
        window.location.hostname.startsWith('192.168.') ||
        window.location.hostname.startsWith('10.') ||
        window.location.hostname.startsWith('172.');

      if ('serviceWorker' in navigator && isDevEnv) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then((names) => {
            for (const name of names) {
              caches.delete(name);
            }
          });
        }
      } else if ('serviceWorker' in navigator && window.location.protocol.startsWith('https')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
