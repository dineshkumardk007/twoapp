name: Two Relay Server CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: TypeScript Check & Cryptographic Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: two-server/package-lock.json

      - name: Install Dependencies
        working-directory: two-server
        run: npm ci

      - name: Run TypeScript Compiler Check
        working-directory: two-server
        run: npx tsc --noEmit

      - name: Start Relay Server in Background
        working-directory: two-server
        run: |
          npm run dev &
          sleep 3

      - name: Execute End-to-End Cryptographic Scenarios
        working-directory: two-server
        run: npx tsx src/scripts/e2e-crypto-runner.ts
